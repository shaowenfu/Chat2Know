name: Pages

# Publishes the landing page in site/ to GitHub Pages
# (https://shaowenfu.github.io/Chat2Know/). It runs when site/ changes on main,
# or by hand from the Actions tab ("Run workflow", any branch the github-pages
# environment allows). The page is static: no build step.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
