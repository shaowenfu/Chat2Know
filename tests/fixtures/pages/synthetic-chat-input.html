<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic chat with an input box</title></head>
<body>
<main>
  <h1>Synthetic chat</h1>
  <p id="answer">The transpose of a product reverses the order: (AB)ᵀ = BᵀAᵀ.</p>
  <form id="composer" onsubmit="return false">
    <textarea id="prompt" aria-label="Message"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <div id="rich"><div contenteditable="true" id="editor" aria-label="Rich message"></div><span role="button" id="rich-send">↑</span></div>
  <form id="login" onsubmit="return false"><input type="password" id="password" aria-label="Password"><button type="submit">Log in</button></form>
</main>
</body>
</html>
